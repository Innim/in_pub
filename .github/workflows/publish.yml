name: Publish

# Runs only after CI succeeds on master. The `branches` filter means this
# workflow produces no run at all on other branches. The k-paxian action
# detects whether the pubspec version is already on pub.dev and skips
# publishing when it is unchanged, so only new versions are released.
on:
  workflow_run:
    workflows: [Analyze and Test]
    types: [completed]
    branches: [master]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Check out the exact commit that passed CI, not just master HEAD.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # Single source of truth for the SDK: reuse the Flutter version from
      # .fvmrc so publish runs on the same Dart as the analyze/test gate.
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - name: Publish in_pub to pub.dev
        uses: k-paxian/dart-package-publisher@8fdba1dbf624c712706281a6f91cb50b6bfc2eaf
        with:
          accessToken: ${{ secrets.OAUTH_ACCESS_TOKEN }}
          refreshToken: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          relativePath: unpub
          skipTests: true
          # flutterBranch takes any git ref, including a release tag, so this
          # pins the exact Flutter version (hence exact Dart) from .fvmrc.
          flutterBranch: ${{ steps.fvm.outputs.flutter }}
