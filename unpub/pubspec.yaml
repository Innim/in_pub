name: in_pub
description: Self-hosted private Dart Pub server for Enterprise, with a simple web interface to search and view packages information.
version: 3.2.2
homepage: https://github.com/Innim/in_pub
environment:
  sdk: ">=3.0.0 <4.0.0"
executables:
  in_pub: in_pub
dependencies:
  args: ^2.2.0
  shelf: ^1.2.0
  shelf_router: ^1.1.1
  http_parser: ^4.0.0
  http: ^0.13.3
  archive: ^3.1.2
  logging: ^1.0.1
  meta: ^1.1.7
  googleapis: ^4.0.0
  yaml: ^3.1.0
  pub_semver: ^2.0.0
  json_annotation: ^4.1.0
  mongo_dart: ^0.7.1
  mime: ^1.0.0
  intl: ^0.17.0
  path: ^1.6.2
  collection: ^1.15.0
  shelf_cors_headers: ^0.1.2
dev_dependencies:
  test: ^1.25.0
  build_runner: ^2.4.0
  # Capped below 6.9.0: newer versions emit null-aware collection elements
  # ('key': ?value), which require an SDK floor of >=3.8.0 to generate.
  json_serializable: ">=6.8.0 <6.9.0"
  shelf_router_generator: ^1.1.0
  chunked_stream: ^1.4.1
