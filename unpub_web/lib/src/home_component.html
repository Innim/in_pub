<main *ngIf="dataLoaded">
  <div class="home-lists-container">
    <div class="home-list" *ngIf="recent != null">
      <div class="landing-page-title-block">
        <div class="tooltip-base hoverable">
          <h2 class="center landing-page-title tooltip-dotted">
            Recently published
          </h2>
        </div>
      </div>

      <ul class="package-list">
        <li class="list-item" *ngFor="let publication of recent!.publications">
          <h3 class="title">
            <a [routerLink]="getPublicationUrl(publication)"
              >{{ publication.name }}</a
            >
          </h3>
          <p class="metadata">
            v
            <a [routerLink]="getPublicationUrl(publication)"
              >{{ publication.version }}</a
            >

            • <span>{{ formatPublished(publication.publishedAt) }}</span>
          </p>
          <p class="description">{{ publication.description }}</p>
        </li>
      </ul>
    </div>

    <div class="home-list" *ngIf="top != null">
      <div class="landing-page-title-block">
        <div class="tooltip-base hoverable">
          <h2 class="center landing-page-title tooltip-dotted">
            Top Dart packages
          </h2>
        </div>
      </div>

      <ul class="package-list">
        <li class="list-item" *ngFor="let package of top!.packages">
          <h3 class="title">
            <a [routerLink]="getDetailUrl(package)">{{ package.name }}</a>
          </h3>
          <p class="metadata">
            <span class="package-tag" *ngFor="let tag of package.tags"
              >{{ tag }}</span
            >
          </p>
          <p class="description">{{ package.description }}</p>
        </li>
      </ul>
    </div>

    <div class="more">
      <a [routerLink]="RoutePaths.list.toUrl()">More Dart packages...</a>
    </div>
  </div>
</main>
